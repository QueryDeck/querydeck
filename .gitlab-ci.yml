stages:
  - deploy

deploy_dev:
  image: node:14.17.4-alpine
  stage: deploy
  only:
    - dev
  environment:
    name: Development
    url: https://app.querydeck-dev.com
  before_script:
    - apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEV_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $DEV_SERVER_ADDRESS "cd querydeck; git pull; sudo docker-compose build --build-arg REACT_APP_MUI_KEY="$REACT_APP_MUI_KEY" --build-arg REACT_APP_OPENREPLAY_KEY="$REACT_APP_OPENREPLAY_KEY" && sudo docker-compose up -d"

deploy_prod:
  image: node:14.17.4-alpine
  stage: deploy
  only:
    - prod
  environment:
    name: Production
    url: https://app.querydeck.io
  before_script:
    - apk add openssh-client
    - eval $(ssh-agent -s)
    - echo "$MAIN_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $MAIN_SERVER_ADDRESS "cd querydeck; git pull; sudo docker-compose build --build-arg REACT_APP_MUI_KEY="$REACT_APP_MUI_KEY" --build-arg REACT_APP_OPENREPLAY_KEY="$REACT_APP_OPENREPLAY_KEY" --build-arg REACT_APP_PUBLIC_POSTHOG_HOST="$REACT_APP_PUBLIC_POSTHOG_HOST" --build-arg REACT_APP_PUBLIC_POSTHOG_KEY="$REACT_APP_PUBLIC_POSTHOG_KEY" && sudo docker-compose up -d"