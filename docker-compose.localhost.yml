services:

  mongo: # container name 
    image: mongo # On which image container will build
    command: mongod --quiet --logpath /dev/null  # disable logging in terminal
    # ports:
    #   - "27017:27017"
    restart: always
    networks: # adding network
      - backend_db
    volumes:
      - mongo-data:/data/db

  be_local:
    build:
      context: './backend'
      dockerfile: Dockerfile.localhost
    env_file: "./backend/.env"
    restart: always
    ports:
      - "3000:3000"
    networks: # adding network
      - backend_db
    depends_on:
    - mongo
    volumes:
      - type: bind
        source: ./backend/
        target: /app/backend/

networks: # allow services to talk to each other while providing isolation from other docker container, running on the same host
  backend_db:
    driver: bridge

volumes: # enable persistence of database data across container restart
  mongo-data:
    driver: local
